version: '3.8'

# Complete Rust FDW Test Environment
# Uses pure Rust implementation with pgrx

services:
  db2:
    image: icr.io/db2_community/db2:11.5.9.0
    container_name: db2_fdw_rust_db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: db2password
      DBNAME: testdb
      SAMPLEDB: "true"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    ports:
      - "50000:50000"
    volumes:
      - db2_data:/database
      - ./db2/init.sql:/var/custom/init.sql
    networks:
      - fdw_network
    healthcheck:
      test: ["CMD", "su", "-", "db2inst1", "-c", "db2 connect to testdb"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  postgres:
    build:
      context: ..
      dockerfile: docker/postgres-rust/Dockerfile
      args:
        PG_MAJOR: 18
    container_name: db2_fdw_rust_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pg_rust_data:/var/lib/postgresql/data
      - ./postgres-rust/init.sql:/docker-entrypoint-initdb.d/10-init.sql
    networks:
      - fdw_network
    depends_on:
      db2:
        condition: service_healthy
    command: >
      postgres
      -c shared_preload_libraries='db2_fdw'
      -c log_statement=all

networks:
  fdw_network:
    driver: bridge

volumes:
  db2_data:
  pg_rust_data:
