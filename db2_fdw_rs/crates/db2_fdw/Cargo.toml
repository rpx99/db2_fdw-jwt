[package]
name = "db2_fdw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DB2 Foreign Data Wrapper for PostgreSQL"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg13 = ["pgrx/pg13"]
pg14 = ["pgrx/pg14"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
pg_test = []

[dependencies]
db2_odbc = { path = "../db2_odbc" }
db2_connection = { path = "../db2_connection" }
db2_query = { path = "../db2_query" }
pgrx.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
pgrx-tests.workspace = true
