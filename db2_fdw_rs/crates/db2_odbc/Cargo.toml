[package]
name = "db2_odbc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Safe ODBC wrapper for DB2 database connections"

[features]
# Enable real ODBC by default - uses Environment::into_static() for 'static lifetime
default = ["real_odbc"]
# Enable real ODBC connections using odbc-api
# Uses global static Environment to allow Connection<'static> lifetime
real_odbc = []

[dependencies]
odbc-api.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
parking_lot = "0.12"

