[workspace]
members = [
    "crates/db2_fdw",
    "crates/db2_connection",
    "crates/db2_odbc",
    "crates/db2_query",
]
resolver = "2"

[workspace.package]
version = "18.1.2"
edition = "2021"
license = "PostgreSQL"
authors = ["Thomas Muenz", "Wolfgang Brandl", "Contributors"]
repository = "https://github.com/Living-Mainframe/db2_fdw"
description = "DB2 Foreign Data Wrapper for PostgreSQL - Rust Implementation"

[workspace.dependencies]
# PostgreSQL Extension Framework
pgrx = "0.16"

# ODBC
odbc-api = "8.1"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Note: PostgreSQL backends are single-threaded, so no thread-safe
# data structures (DashMap, Mutex) are needed. We use RefCell + HashMap.

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Decimal
rust_decimal = "1.36"

# Utilities
bitflags = "2.6"

[profile.dev]
panic = "unwind"
opt-level = 0

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
strip = true
